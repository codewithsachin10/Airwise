services:
  - type: web
    name: airwise
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: AIRWISE_DEMO_MODE
        value: "false"
      - key: DATABASE_URL
        sync: false