{% extends "base.html" %}
{% block title %}Profile Settings · AIRWISE{% endblock %}
{% block content %}<section class="auth-wrap"><div class="auth-panel"><p class="eyebrow">ACCOUNT SETTINGS</p><h1>User profile</h1><p class="muted">Update contact details and password.</p><form method="post"><label>Username / email</label><input value="{{ user.username }}" readonly><label>Account role</label><input value="{{ user.role }}" readonly><label>Full name</label><input name="fullName" value="{{ user.full_name }}" required maxlength="120"><label>Phone number</label><input type="tel" name="phone" value="{{ user.phone or '' }}" maxlength="30"><label>New password (leave blank to keep current)</label><input type="password" name="newPassword" minlength="6" maxlength="72" autocomplete="new-password"><button class="button button-primary w-100" type="submit">Save profile changes</button></form></div></section>{% endblock %}
