{% extends "base.html" %}
{% block title %}Register · AIRWISE{% endblock %}
{% block content %}<section class="auth-wrap"><div class="auth-panel auth-wide"><p class="eyebrow">PASSENGER SERVICES</p><h1>Create an account</h1><p class="muted">Register to manage airport rides, follow reports, and keep your journey information together.</p><form method="post" action="{{ url_for('register') }}"><fieldset><legend>Account role</legend><label class="choice"><input type="radio" name="role" value="ROLE_PASSENGER" {% if not form.get('role') or form.get('role')=='ROLE_PASSENGER' %}checked{% endif %}> Passenger</label><label class="choice"><input type="radio" name="role" value="ROLE_TAXI_OPERATOR" {% if form.get('role')=='ROLE_TAXI_OPERATOR' %}checked{% endif %}> Taxi operator</label></fieldset><div class="form-two"><div><label for="fullName">Full name</label><input id="fullName" name="fullName" value="{{ form.get('fullName','') }}" required maxlength="120"></div><div><label for="username">Username / email</label><input id="username" name="username" value="{{ form.get('username','') }}" required maxlength="100" autocomplete="username"></div><div><label for="phone">Contact phone</label><input id="phone" name="phone" type="tel" value="{{ form.get('phone','') }}" maxlength="30"></div><div><label for="password">Password</label><input id="password" name="password" type="password" required minlength="6" maxlength="72" autocomplete="new-password"></div><div><label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" required minlength="6" maxlength="72" autocomplete="new-password"></div></div><button class="button button-primary w-100" type="submit">Complete registration <span aria-hidden="true">→</span></button></form><p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></div></section>{% endblock %}
