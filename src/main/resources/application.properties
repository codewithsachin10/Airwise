# ==============================================================================
# AIRWISE - Smart Airport Intelligence & Passenger Assistance System Configuration
# ==============================================================================
server.port=8080
spring.application.name=airwise

# Database Configuration (MySQL 8.0 Default)
spring.datasource.url=jdbc:mysql://localhost:3306/airwise?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# File Uploads (Complaint attachments)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Application specific settings
airwise.demo-mode=true
airwise.simulation.active=true
airwise.prediction.weather-factor=0.30
airwise.prediction.turnaround-threshold=50
