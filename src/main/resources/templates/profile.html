<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html_head('Profile Settings')}"></head>
<body>

<div th:replace="~{fragments/layout :: alert_ticker}"></div>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: flash_messages}"></div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="aw-card p-4 shadow-sm">
                <div class="text-center mb-4">
                    <div class="stat-icon blue mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.6rem;">
                        <i class="bi bi-person-gear"></i>
                    </div>
                    <h3 class="fw-bold text-navy-900">User Profile Settings</h3>
                    <p class="text-muted small">Update your personal contact information and security preferences.</p>
                </div>

                <form th:action="@{/profile}" method="post">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Account Username / Email</label>
                        <input type="text" class="form-control bg-light" th:value="${user.username}" readonly>
                        <div class="form-text small">Account identity handle cannot be altered.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Account Role</label>
                        <input type="text" class="form-control bg-light" th:value="${user.role}" readonly>
                    </div>

                    <div class="mb-3">
                        <label for="fullName" class="form-label small fw-semibold">Full Name</label>
                        <input type="text" id="fullName" name="fullName" class="form-control" th:value="${user.fullName}" required>
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label small fw-semibold">Phone Number</label>
                        <input type="tel" id="phone" name="phone" class="form-control" th:value="${user.phone}">
                    </div>

                    <div class="mb-4">
                        <label for="newPassword" class="form-label small fw-semibold">New Password (leave blank to keep current)</label>
                        <input type="password" id="newPassword" name="newPassword" class="form-control" placeholder="••••••••">
                    </div>

                    <button type="submit" class="btn btn-airwise w-100 py-2 fw-semibold">
                        <i class="bi bi-check2-circle me-1"></i> Save Profile Changes
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
