<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html_head('Access Denied')}"></head>
<body class="bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container py-5 my-auto text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="aw-card p-5 shadow-lg">
                <div class="stat-icon rose mx-auto mb-3" style="width: 64px; height: 64px; font-size: 2rem;">
                    <i class="bi bi-shield-x"></i>
                </div>
                <h2 class="fw-bold text-navy-900 mb-2">403 — Access Restricted</h2>
                <p class="text-muted mb-4">
                    You do not have the required role permissions to view this terminal operations section. Please sign in with an authorized account or return to the passenger dashboard.
                </p>
                <div class="d-flex justify-content-center gap-3">
                    <a th:href="@{/}" class="btn btn-outline-secondary">Return Home</a>
                    <a th:href="@{/login}" class="btn btn-airwise">Switch Account</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
