<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html_head('Error Occurred')}"></head>
<body class="bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container py-5 my-auto text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="aw-card p-5 shadow-lg">
                <div class="stat-icon amber mx-auto mb-3" style="width: 64px; height: 64px; font-size: 2rem;">
                    <i class="bi bi-exclamation-triangle"></i>
                </div>
                <h2 class="fw-bold text-navy-900 mb-2">Operational Notice</h2>
                <p class="text-muted mb-4">
                    The requested airport operational page or resource could not be loaded. Please verify your query or return to the main hub.
                </p>
                <div class="d-flex justify-content-center gap-3">
                    <a th:href="@{/}" class="btn btn-outline-secondary">Go to Homepage</a>
                    <a th:href="@{/flights/search}" class="btn btn-airwise">Search Flights</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
