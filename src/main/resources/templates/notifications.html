<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html_head('Notifications')}"></head>
<body>

<div th:replace="~{fragments/layout :: alert_ticker}"></div>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: flash_messages}"></div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold text-navy-900 m-0"><i class="bi bi-bell text-primary me-2"></i>Activity & Alert Notifications</h2>
                    <p class="text-muted small m-0">Real-time alerts regarding flight schedule shifts, taxi status, and complaint updates.</p>
                </div>
                <form th:action="@{/notifications/read-all}" method="post" th:if="${not #lists.isEmpty(notifications)}">
                    <button type="submit" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-check2-all me-1"></i> Mark All Read
                    </button>
                </form>
            </div>

            <div class="aw-card">
                <div class="list-group list-group-flush">
                    <div th:if="${#lists.isEmpty(notifications)}" class="text-center py-5 text-muted">
                        <i class="bi bi-bell-slash fs-2 text-secondary d-block mb-2"></i>
                        No notifications yet.
                    </div>
                    <div th:each="n : ${notifications}" class="list-group-item p-3"
                         th:classappend="${!n.read ? 'bg-primary bg-opacity-10 border-start border-4 border-primary' : ''}">
                        <div class="d-flex justify-content-between align-items-start">
                            <div class="d-flex align-items-start gap-3">
                                <i th:if="${n.type == 'FLIGHT'}" class="bi bi-airplane-engines-fill text-primary fs-4 mt-1"></i>
                                <i th:if="${n.type == 'TAXI'}" class="bi bi-car-front-fill text-success fs-4 mt-1"></i>
                                <i th:if="${n.type == 'COMPLAINT'}" class="bi bi-megaphone-fill text-warning fs-4 mt-1"></i>
                                <i th:if="${n.type == 'SYSTEM'}" class="bi bi-info-circle-fill text-info fs-4 mt-1"></i>
                                <div>
                                    <strong class="d-block text-dark" th:text="${n.title}">Notification Title</strong>
                                    <p class="small text-secondary mb-1" th:text="${n.message}">Notification content.</p>
                                    <div class="d-flex align-items-center gap-3">
                                        <span class="small text-muted" th:text="${#temporals.format(n.createdAt, 'dd MMM yyyy, HH:mm')}">Date</span>
                                        <a th:if="${n.linkUrl != null}" th:href="${n.linkUrl}" class="small text-primary text-decoration-none fw-semibold">
                                            View Related Record <i class="bi bi-arrow-right"></i>
                                        </a>
                                    </div>
                                </div>
                            </div>
                            <div th:unless="${n.read}">
                                <form th:action="@{'/notifications/' + ${n.id} + '/read'}" method="post">
                                    <button type="submit" class="btn btn-sm btn-outline-secondary py-0" title="Mark as read">
                                        <i class="bi bi-check2"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
